name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show Godot version
        run: godot --version
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Run main scene smoke test
        run: godot --headless --path . --quit-after 8
