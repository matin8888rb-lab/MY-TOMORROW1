name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Android SDK packages required by Godot 4.4
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Install download utility
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates

      - name: Install matching Godot Android export templates
        run: |
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz \
            --output /tmp/godot-templates/export_templates.tpz
          unzip -q /tmp/godot-templates/export_templates.tpz -d /tmp/godot-templates
          test -s /tmp/godot-templates/templates/android_debug.apk
          test -s /tmp/godot-templates/templates/android_release.apk
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          printf '4.4.1.stable' > "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"

      - name: Configure Godot Android paths and debug signing
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          base64 -d ci/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Verify complete Android build environment
        run: |
          godot --version
          java -version
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.android/debug.keystore"
          grep -F 'export/android/java_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"
          grep -F 'export/android/android_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Import and validate project
        run: godot --headless --editor --path . --quit

      - name: Restart and verify ADB service
        run: |
          adb kill-server || true
          adb start-server
          adb version
          adb devices -l

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/MY_TOMORROW-debug.apk

      - name: Verify APK package
        run: |
          test -s build/MY_TOMORROW-debug.apk
          ls -lh build/MY_TOMORROW-debug.apk
          unzip -t build/MY_TOMORROW-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/MY_TOMORROW-debug.apk
          sha256sum build/MY_TOMORROW-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MY-TOMORROW-Android-debug
          path: build/MY_TOMORROW-debug.apk
          if-no-files-found: error
          retention-days: 14
